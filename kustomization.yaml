# Apply everything (in a safe order) with:  kubectl apply -k kubernetes/
# The Secret is NOT listed here on purpose: create it first with
# kubernetes/create-secret.sh (see README, "Kubernetes deployment").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-locker
resources:
  - kubernetes/namespace.yaml
  - kubernetes/configmap.yaml
  - kubernetes/postgres/pvc.yaml
  - kubernetes/postgres/deployment.yaml
  - kubernetes/postgres/service.yaml
  - kubernetes/backend/deployment.yaml
  - kubernetes/backend/service.yaml
  - kubernetes/frontend/deployment.yaml
  - kubernetes/frontend/service.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - database/init/01-schema.sql
      - database/init/02-seed.sql