# Prometheus scrape config for Docker Compose (docker compose --profile monitoring up).
# DNS discovery returns every container behind a service name, so scaled-out
# services (docker compose up --scale locker-controller=2) are all scraped.
# The `app` and `pod` labels match what the Kubernetes config produces, so the
# same Grafana dashboard works in both places.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8000
    relabel_configs:
      - target_label: app
        replacement: backend
      - source_labels: [__address__]
        target_label: pod

  - job_name: locker-controller
    dns_sd_configs:
      - names: [locker-controller]
        type: A
        port: 9100
    relabel_configs:
      - target_label: app
        replacement: locker-controller
      - source_labels: [__address__]
        target_label: pod

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
