# A 3-node local Kubernetes cluster (1 control plane + 2 workers) with kind.
# Used by CI, and handy for showing pods and database replicas spread across
# nodes, or what happens when a node dies:
#
#   kind create cluster --name smart-locker --config kubernetes/kind-cluster.yaml
#   docker stop smart-locker-worker        # "kill" a node, then watch the pods move
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
