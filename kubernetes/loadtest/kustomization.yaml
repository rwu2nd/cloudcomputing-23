# Load test that runs INSIDE the cluster, so requests go through the frontend
# Service and are spread across all backend pods (a port-forward would send
# everything to one pod). Start it with `make k8s-loadtest`, or:
#
#   kubectl -n smart-locker delete job k6-load-test --ignore-not-found
#   kubectl apply -k kubernetes/loadtest
#   kubectl -n smart-locker logs -f job/k6-load-test
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-locker
resources:
  - job.yaml
configMapGenerator:
  - name: k6-script
    options:
      disableNameSuffixHash: true
    files:
      - smart-locker.js
