# Identity for the backend pods, and READ-ONLY access to the objects shown on
# the admin dashboard's System tests pages (pods, autoscaler, database
# cluster, load-test jobs). Namespaced only. Changing anything needs the extra
# Role in kubernetes/demo-controls/, which is not applied by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: smart-locker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-demo-read
  namespace: smart-locker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-demo-read
  namespace: smart-locker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-demo-read
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: smart-locker
