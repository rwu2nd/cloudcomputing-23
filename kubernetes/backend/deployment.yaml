# FastAPI backend, with readiness and liveness probes (backend/app/health.py).
# The replica count (2-6) is managed by the HorizontalPodAutoscaler in hpa.yaml,
# so there is deliberately no `replicas:` field here: re-applying this file
# would otherwise reset whatever the autoscaler had chosen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-locker
  labels:
    app: backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      # Move pods off a dead node after 30s instead of the default 5 minutes.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: backend
          # Built locally (docker compose build) and loaded into the cluster:
          # see "Kubernetes deployment" in the README. Never pulled from a registry.
          image: smart-locker-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Every key in the ConfigMap and the Secret becomes an environment
          # variable (POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, ...).
          envFrom:
            - configMapRef:
                name: locker-config
            - secretRef:
                name: locker-db-secret
          # Gives the app up to ~60s to start before the other probes begin.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # "Should this pod receive traffic?" - fails (pod removed from the
          # Service, NOT restarted) while the database is unreachable.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # "Is the process alive?" - must not depend on the database.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # The HPA measures CPU against the request (0.2 cores), so keep it
          # realistic; the limit lets a busy pod use up to one core.
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
