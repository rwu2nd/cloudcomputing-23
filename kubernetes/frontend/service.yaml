# Internal address of the frontend. Reach it from your laptop with:
#   kubectl -n smart-locker port-forward svc/frontend 8080:80
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-locker
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
