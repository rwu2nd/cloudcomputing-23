# PgBouncer connection pooler in front of the primary, managed by CloudNativePG.
#
# The backend opens a short-lived connection for almost every request, and the
# autoscaler can run up to 6 backend pods. Without a pooler every one of those
# connections becomes a PostgreSQL process; with it, many client connections
# share a small, fixed number of server connections.
#
# Transaction pooling works for this app because the only locking it uses is
# pg_advisory_xact_lock, which is released at the end of each transaction.
#
# The backend connects to the Service this creates: locker-db-pooler-rw:5432.
# After a failover PgBouncer reconnects to the new primary on its own.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: locker-db-pooler-rw
  namespace: smart-locker
spec:
  cluster:
    name: locker-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "40"
      # After a failover the old primary is gone; retry the new one every
      # second instead of PgBouncer's default 15s, which shortens the outage.
      server_login_retry: "1"
      server_connect_timeout: "3"
